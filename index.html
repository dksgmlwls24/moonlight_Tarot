<style>
:root{--bg:#0b0814;--panel:#171126;--text:#f7f1ff;--muted:#bdb0cf;--gold:#e3c889;--violet:#9c7ae6}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,#45306b 0,#171027 36%,var(--bg) 72%);padding:env(safe-area-inset-top) 0 88px}
main{width:min(92vw,720px);margin:auto;padding:36px 0 60px}.brand{text-align:center;color:#d9c5ff;letter-spacing:.28em;font-size:12px}.moon{text-align:center;font-size:46px;margin-top:10px}h1{text-align:center;margin:4px 0 6px;font-size:34px}.sub{text-align:center;color:var(--muted);margin:0 0 28px}
.panel,.result{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:24px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.25);backdrop-filter:blur(12px)}
label,.label{display:block;font-weight:750;margin:0 0 10px}textarea{width:100%;min-height:108px;border-radius:16px;border:1px solid #514665;background:#110d1d;color:white;padding:14px;font:inherit;resize:none;outline:none}textarea:focus{border-color:#b89bff}
.group{margin-top:22px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid #504663;background:#181322;color:#d9d0e6;border-radius:999px;padding:10px 13px;font:inherit}.choice.active{background:#8461d2;border-color:#bda2ff;color:white}
.primary,.secondary{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:800;cursor:pointer}.primary{margin-top:26px;background:linear-gradient(135deg,#e4cb91,#b58bdf);color:#17101f}.secondary{margin-top:18px;background:transparent;border:1px solid #655778;color:white}
#reading{display:none}.q{text-align:center;color:#ddd0ef;line-height:1.5;margin:14px 0 22px}.hint{text-align:center;color:var(--muted);margin-bottom:20px}.cards{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.wrap{perspective:1000px}.card{width:126px;height:210px;position:relative;transform-style:preserve-3d;transition:.65s;cursor:pointer}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;border:1.5px solid #c8a9ff;overflow:hidden}.back{display:grid;place-items:center;background:radial-gradient(circle,#4d3674,#171024);font-size:46px;box-shadow:0 0 28px rgba(169,127,255,.2)}.front{transform:rotateY(180deg);background:linear-gradient(155deg,#f4ecff,#cfbdea);color:#21172e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}.num{font-size:11px;opacity:.65}.emoji-art{font-size:50px;line-height:1;margin:12px 0}.name{font-weight:900}.dir{font-size:12px;margin-top:7px}
#results{display:none;margin-top:28px}.result{margin-bottom:10px}.result::after{content:"";display:block;clear:both}.pos{font-size:12px;color:#c8a9ff}.title{font-size:19px;font-weight:900;margin:6px 0}.keyword{color:#e5d8f2;margin-bottom:8px}.text{color:#cfc4da;line-height:1.65}.cat-text{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(227,200,137,.3);color:#e9dcc0;line-height:1.65}.cat-text b{color:var(--gold)}.advice{border-color:#705a91;background:linear-gradient(135deg,rgba(143,102,213,.18),rgba(255,255,255,.05))}
.result-emoji{width:76px;height:112px;border-radius:10px;border:1px solid rgba(227,200,137,.55);float:left;margin:0 14px 8px 0;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(155deg,#efe6ff,#cbb8ea)}
.deck-stage{position:relative;min-height:300px;margin:6px -4px 8px;overflow:hidden}.deck{position:relative;height:270px;display:flex;align-items:center;justify-content:center}.pick-card{position:absolute;width:92px;height:154px;border-radius:14px;border:1.5px solid #c8a9ff;background:radial-gradient(circle at 50% 35%,#4d3674,#171024 68%);box-shadow:0 12px 28px rgba(0,0,0,.34),0 0 18px rgba(169,127,255,.12);display:grid;place-items:center;font-size:31px;color:#eadcff;cursor:pointer;transition:transform .42s cubic-bezier(.2,.8,.2,1),filter .25s;transform-origin:50% 130%}.pick-card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(227,200,137,.45);border-radius:10px}.pick-card.chosen{filter:brightness(1.35);box-shadow:0 16px 35px rgba(0,0,0,.42),0 0 26px rgba(227,200,137,.42)}.pick-card.disabled{pointer-events:none}.shuffle-note{text-align:center;color:#d8c9ec;margin-top:-10px;font-size:14px}@keyframes shuffleLeft{0%,100%{transform:translate(0,0)}25%{transform:translate(-82px,-12px) rotate(-8deg)}50%{transform:translate(70px,8px) rotate(7deg)}75%{transform:translate(-38px,4px) rotate(-4deg)}}@keyframes shuffleRight{0%,100%{transform:translate(0,0)}25%{transform:translate(78px,8px) rotate(8deg)}50%{transform:translate(-72px,-10px) rotate(-7deg)}75%{transform:translate(42px,2px) rotate(5deg)}}.pick-card.shuffling:nth-child(odd){animation:shuffleLeft .55s ease-in-out 2}.pick-card.shuffling:nth-child(even){animation:shuffleRight .55s ease-in-out 2}
.today-card-box{margin:0 0 18px;padding:20px;border-radius:22px;border:1px solid rgba(227,200,137,.35);background:linear-gradient(145deg,rgba(227,200,137,.10),rgba(156,122,230,.10));text-align:center}
.today-card-box h2{margin:4px 0 7px;font-size:22px}
.today-card-box p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.today-card-box .primary{margin-top:16px}
.today-badge{display:inline-block;margin-bottom:7px;padding:5px 9px;border-radius:999px;background:rgba(227,200,137,.14);color:#ead39f;font-size:11px;letter-spacing:.08em}
.history-entry{margin-bottom:12px;padding:16px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10)}
.history-date{font-size:12px;color:#bca9d4;margin-bottom:6px}.history-question{font-weight:800;margin-bottom:8px;line-height:1.45}.history-empty{text-align:center;color:var(--muted);padding:36px 10px;line-height:1.7}
.history-emoji-card{width:76px;height:112px;border-radius:10px;border:1px solid rgba(227,200,137,.55);margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(155deg,#efe6ff,#cbb8ea);overflow:hidden}
.history-emoji-symbol{display:inline-block;line-height:1}
.history-card-detail{display:flex;gap:13px;align-items:flex-start;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.history-card-detail:first-child{border-top:0;padding-top:4px}
.history-card-visual{flex:0 0 76px;text-align:center;font-size:11px;color:#ddd0e8}
.history-card-copy{flex:1;min-width:0}
.del-entry{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;cursor:pointer}.del-entry .history-entry{flex:1;min-width:0;margin-bottom:0;border-radius:18px}.del-entry input{appearance:none;-webkit-appearance:none;flex:0 0 24px;width:24px;height:24px;margin:16px 0 0;border-radius:50%;border:2px solid #8f7fb0;background:transparent;cursor:pointer}.del-entry input:checked{border-color:#e3c889;background:radial-gradient(circle,#e3c889 0 45%,transparent 50%)}.del-entry:has(input:checked) .history-entry{border-color:#e3c889;background:rgba(227,200,137,.08)}
.delete-bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,680px);display:flex;gap:10px;z-index:10000;padding:10px;border-radius:18px;background:rgba(18,13,34,.96);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);box-shadow:0 10px 35px rgba(0,0,0,.35)}.delete-bar button{flex:1;padding:14px;border-radius:14px;font:inherit;font-weight:800;cursor:pointer;border:1px solid #665877;background:transparent;color:#d8cfdf}.delete-bar #deleteConfirm{background:linear-gradient(135deg,#e4cb91,#b58bdf);border:0;color:#17101f}.delete-bar #deleteConfirm:disabled{opacity:.4;cursor:default}
.history-card-pos{display:inline-block;margin-bottom:5px;padding:2px 8px;border-radius:999px;background:rgba(156,122,230,.2);color:#c8a9ff;font-size:11px;font-weight:700}
.history-card-name{font-weight:900;font-size:15px;margin-bottom:4px}
.history-card-keyword{font-size:13px;color:#e4d2a5;margin-bottom:5px;line-height:1.45}
.history-card-text{font-size:13px;color:#cfc4da;line-height:1.6}
.history-card-text+.history-card-text{margin-top:5px;color:#e9dcc0}
.nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,680px);display:flex;z-index:9999;padding:7px;border-radius:18px;background:rgba(18,13,34,.94);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);box-shadow:0 10px 35px rgba(0,0,0,.35)}.nav button{flex:1;border:0;background:transparent;color:#c8bdd5;padding:9px 5px;border-radius:12px;font:inherit;font-size:12px}.nav button.active{background:rgba(156,122,230,.22);color:#fff}.clear-btn{margin-top:14px;width:100%;padding:12px;border-radius:14px;border:1px solid #665877;background:transparent;color:#d8cfdf}
[hidden]{display:none!important}
#home{position:relative}
.install-btn{position:absolute;top:-22px;right:0;display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;border:1px solid rgba(227,200,137,.5);background:rgba(227,200,137,.12);color:#ead39f;font:inherit;font-size:13px;font-weight:800;cursor:pointer;backdrop-filter:blur(8px)}
.install-btn:active{transform:scale(.96)}
.modal{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,3,12,.7);backdrop-filter:blur(4px)}
.modal-box{width:min(100%,380px);padding:24px 20px 20px;border-radius:22px;background:#171126;border:1px solid rgba(227,200,137,.35);box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
.modal-box img{width:72px;height:72px;border-radius:16px}
.modal-box h2{margin:12px 0 10px;font-size:20px}
.modal-box ol{text-align:left;margin:0;padding-left:22px;color:#d8cfdf;line-height:1.75;font-size:14px}
.modal-box .primary{margin-top:20px}
@media(max-width:390px){main{width:94vw}.card{width:105px;height:176px}.emoji-art{font-size:40px;margin:9px 0}h1{font-size:30px}}
</style>
</head>
<body>
<main>
<section id="home">
<button type="button" class="install-btn" id="installBtn" hidden>📲 앱 설치</button>
<div class="brand">MOONLIGHT TAROT</div><div class="moon">🌙</div><h1>달빛 타로</h1>
<p class="sub">마음속 질문을 떠올리고 카드를 선택하세요.</p>
<div class="today-card-box">
<div class="today-badge">DAILY CARD</div>
<h2>오늘의 카드</h2>
<p>오늘 나에게 필요한 메시지를 한 장 뽑아보세요.</p>
<button class="primary" id="todayStart">오늘의 카드 뽑기 ✦</button>
</div>
<div class="panel">
<label for="question">무엇이 궁금한가요?</label>
<textarea id="question" placeholder="예) 그 사람과 앞으로 관계가 어떻게 흘러갈까요?"></textarea>
<div class="group"><span class="label">질문 분야</span><div class="choices" id="cats">
<button class="choice active" data-v="연애">💕 연애</button><button class="choice" data-v="직장·학업">💼 직장·학업</button><button class="choice" data-v="금전">💰 금전</button><button class="choice" data-v="인간관계">🤝 인간관계</button><button class="choice" data-v="종합">🌙 종합</button>
</div></div>
<div class="group"><span class="label">카드 배열</span><div class="choices" id="spreads">
<button class="choice active" data-v="1">🔮 한 장 리딩</button><button class="choice" data-v="3">✨ 세 장 리딩</button>
</div></div>
<button class="primary" id="start">카드 섞기 ✦</button>
</div>
</section>

<section id="reading">
<div class="brand">MOONLIGHT TAROT</div><div class="moon">✦</div><h1>카드를 선택하세요</h1>
<div class="q" id="qview"></div><div class="hint">마음이 가는 카드를 눌러 확인하세요</div>
<div class="deck-stage" id="deckStage"><div class="deck" id="deck"></div><div class="shuffle-note" id="pickNote">카드를 섞는 중이에요…</div></div><div class="cards" id="cards" style="display:none"></div><div id="results"></div>
</section>

<section id="history" style="display:none">
<div class="brand">MOONLIGHT TAROT</div><div class="moon">📖</div><h1>타로 기록</h1>
<p class="sub">이 기기에 저장된 나의 리딩을 모아봐요.</p>
<div id="historyList"></div>
<button type="button" class="clear-btn" id="clearHistory">기록 삭제</button>
</section>

<section id="historyDelete" style="display:none">
<div class="brand">MOONLIGHT TAROT</div><div class="moon">🗑️</div><h1>기록 삭제</h1>
<p class="sub">삭제할 기록을 선택하세요.</p>
<div id="deleteList"></div>
<div class="delete-bar">
<button type="button" id="deleteCancel">취소</button>
<button type="button" id="deleteConfirm" disabled>삭제</button>
</div>
</section>
</main>

<div class="modal" id="installGuide" hidden>
<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="installTitle">
<img src="icon-192-v2.png" alt="">
<h2 id="installTitle">달빛 타로 앱 설치</h2>
<ol id="installSteps"></ol>
<button type="button" class="primary" id="installClose">확인</button>
</div>
</div>

<nav class="nav" id="nav">
<button id="navHome" class="active">🏠<br>홈</button>
<button id="navHistory">📖<br>기록</button>
</nav>

<script>
// kw/text/cat 값은 [정방향, 역방향] 순서
const tarot=[
{num:"0",name:"바보",sym:"🌄",kw:["새로운 시작 · 자유 · 가능성","충동 · 준비 부족 · 망설임"],text:["새로운 흐름이 시작될 가능성을 나타냅니다. 결과를 지나치게 계산하기보다 새로운 경험을 받아들이는 것이 중요한 시기입니다.","성급한 선택이나 준비되지 않은 행동을 조심할 필요가 있습니다. 한 번 더 상황을 확인해보세요."],cat:{
 "연애":["새로운 만남이나 관계의 새 국면이 찾아올 수 있어요. 가볍고 설레는 마음으로 다가가 보세요.","감정만 앞선 성급한 고백이나 관계 진전은 잠시 미루는 게 좋아요."],
 "직장·학업":["새로운 프로젝트나 공부를 시작하기 좋은 흐름이에요. 완벽한 준비보다 첫걸음이 중요해요.","준비 없이 뛰어들면 시행착오가 커질 수 있어요. 기본 계획부터 세워보세요."],
 "금전":["새로운 수입원이나 기회가 보일 수 있지만, 작게 시작해보는 것이 좋아요.","충동구매나 검증되지 않은 투자는 피하세요."],
 "인간관계":["새로운 사람들과 편하게 어울리며 인연이 넓어질 수 있어요.","가벼운 말이나 행동이 오해를 부를 수 있으니 조심하세요."]}},
{num:"I",name:"마법사",sym:"✨",kw:["능력 · 시작 · 실행력","자신감 부족 · 계획만 있음"],text:["필요한 능력과 자원이 이미 갖춰져 있음을 의미합니다. 생각을 실제 행동으로 옮길 때입니다.","가능성은 있지만 제대로 활용하지 못하고 있을 수 있습니다. 계획보다 실행이 필요한 시기입니다."],cat:{
 "연애":["먼저 표현하고 다가가면 관계를 원하는 방향으로 이끌 수 있어요.","말과 행동이 다르게 느껴질 수 있어요. 상대의 진심을 행동으로 확인해보세요."],
 "직장·학업":["가진 역량을 발휘할 기회예요. 아이디어를 구체적인 결과물로 만들어보세요.","계획은 충분하니 이제 실제로 손을 움직여야 할 때예요."],
 "금전":["자신의 기술이나 재능으로 수입을 만들 수 있는 흐름이에요.","그럴듯한 말에 끌린 지출이나 투자는 한 번 더 따져보세요."],
 "인간관계":["대화를 주도하며 좋은 인상을 남길 수 있어요.","상대를 설득하려 하기보다 솔직하게 소통하는 게 좋아요."]}},
{num:"II",name:"여사제",sym:"🌙",kw:["직감 · 비밀 · 내면","혼란 · 직감 무시"],text:["겉으로 드러난 정보보다 직감과 내면의 목소리가 중요한 상황입니다.","불안이나 선입견 때문에 본질을 놓칠 수 있습니다. 감정과 사실을 구분해보세요."],cat:{
 "연애":["드러나지 않은 마음이 있어요. 서두르지 말고 상대의 속도를 존중하세요.","확인되지 않은 추측 때문에 혼자 불안해하고 있을 수 있어요."],
 "직장·학업":["조용히 준비하고 공부하는 것이 좋은 결과로 이어져요.","중요한 정보를 놓치고 있을 수 있어요. 세부 사항을 다시 확인하세요."],
 "금전":["큰 결정보다 정보를 모으고 관망하는 것이 유리해요.","감에만 의존한 금전 결정은 위험할 수 있어요."],
 "인간관계":["말하지 않아도 통하는 사람이 곁에 있어요. 직감을 믿어보세요.","숨기거나 감추는 일이 관계에 거리감을 만들 수 있어요."]}},

 "연애":["따뜻하고 안정적인 애정이 깊어지는 흐름이에요.","한쪽이 너무 많이 베풀거나 기대하고 있지 않은지 살펴보세요."],
 "직장·학업":["꾸준히 쌓아온 노력이 결실을 맺기 시작해요.","성과가 정체된 느낌이라면 환경이나 방식을 바꿔보세요."],

 "직장·학업":["정보가 부족한 상태이니 중요한 결정은 미루세요.","불확실했던 상황이 점차 명확해져요."],
 "금전":["불확실한 투자나 거래는 조심하세요.","애매했던 금전 문제가 정리되기 시작해요."],
 "인간관계":["겉으로 보이는 것과 속마음이 다를 수 있어요.","오해가 풀리고 관계가 투명해질 수 있어요."]}},
{num:"XIX",name:"태양",sym:"☀️",kw:["성공 · 기쁨 · 명확함","지연된 성공 · 과도한 기대"],text:["긍정적인 흐름과 명확한 결과를 의미합니다.","좋은 가능성은 있지만 기대한 속도보다 조금 늦을 수 있습니다."],cat:{
 "연애":["밝고 행복한 관계, 마음을 드러내기 좋은 때예요.","좋은 흐름이지만 조급해하지 말고 천천히 즐기세요."],
 "직장·학업":["성과가 드러나고 인정받는 시기예요.","결과가 기대보다 조금 늦게 나올 수 있어요."],
 "금전":["재정적으로 좋은 결과를 기대할 수 있어요.","들뜬 마음에 과소비하지 않도록 주의하세요."],
 "인간관계":["밝은 에너지로 사람들이 모여들어요.","지나친 기대가 서운함으로 바뀌지 않게 해요."]}},
{num:"XX",name:"심판",sym:"📯",kw:["결정 · 깨달음 · 재도전","결정 회피 · 후회"],text:["중요한 결정을 내리고 다음 단계로 넘어갈 시점입니다.","과거에 대한 후회 때문에 결정을 미루고 있을 수 있습니다."],cat:{
 "연애":["관계에 대한 결단의 시간, 재회나 새 출발의 가능성이 있어요.","과거의 상처 때문에 새로운 관계를 망설이고 있을 수 있어요."],
 "직장·학업":["재도전이나 새로운 결정을 내리기 좋은 때예요.","결정을 미룰수록 기회가 멀어질 수 있어요."],
 "금전":["지난 재정 결정을 되돌아보고 새 계획을 세워보세요.","과거 손실에 대한 후회가 판단을 흐리고 있을 수 있어요."],
 "인간관계":["소식이 끊겼던 사람과 다시 연결될 수 있어요.","지난 일에 대한 앙금을 정리해야 앞으로 나아갈 수 있어요."]}},
{num:"XXI",name:"세계",sym:"🌍",kw:["완성 · 성취 · 새로운 단계","미완성 · 마무리 필요"],text:["하나의 과정이 성공적으로 마무리되고 새로운 단계로 이동하는 흐름입니다.","거의 완성됐지만 아직 해결해야 할 작은 부분이 남아 있습니다."],cat:{
 "연애":["관계가 안정되고 완성되는 흐름이에요. 한 단계 깊어질 수 있어요.","마음 한편에 해결되지 않은 부분이 남아 있어요."],
 "직장·학업":["목표를 달성하고 좋은 마무리를 하게 돼요.","마지막 마무리를 소홀히 하면 아쉬움이 남을 수 있어요."],
 "금전":["재정 목표를 달성하거나 안정이 찾아와요.","거의 다 왔으니 끝까지 계획을 지키세요."],
 "인간관계":["폭넓은 관계 속에서 소속감과 만족을 느껴요.","마무리하지 못한 관계의 문제를 정리해보세요."]}}
];

const HISTORY_KEY="moonlightTarotHistoryV1";
const TODAY_KEY="moonlightTarotTodayV1";
const $=id=>document.getElementById(id);
let category="연애",spread=1,selected=[],readingMode="question";

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function localDateKey(d=new Date()){
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}
function readingOf(o){
 const d=o.rev?1:0;
 return {kw:o.c.kw[d],text:o.c.text[d],catText:o.c.cat[category]?.[d]||""};
}
function mainKeyword(o){return readingOf(o).kw.split(" · ")[0]}

function bind(group,cb){document.querySelectorAll(group+" .choice").forEach(b=>b.onclick=()=>{document.querySelectorAll(group+" .choice").forEach(x=>x.classList.remove("active"));b.classList.add("active");cb(b.dataset.v)})}
bind("#cats",v=>category=v); bind("#spreads",v=>spread=+v);

function resetReading(){
 selected=[];
 $("deckStage").style.display="block";
 $("cards").style.display="none";$("cards").innerHTML="";
 $("results").style.display="none";$("results").innerHTML="";
}
function openReading(){
 $("home").style.display="none";$("history").style.display="none";$("reading").style.display="block";
}

$("start").onclick=()=>{
 const q=$("question").value.trim();
 if(!q){alert("먼저 궁금한 질문을 적어주세요 🌙");return}
 readingMode="question";
 category=document.querySelector("#cats .choice.active").dataset.v;
 spread=+document.querySelector("#spreads .choice.active").dataset.v;
 resetReading();openReading();
 document.querySelector("#reading h1").textContent="카드를 선택하세요";
 document.querySelector(".hint").textContent="마음이 가는 카드를 눌러 확인하세요";
 $("qview").innerHTML="“"+escapeHtml(q)+"”<br><small>"+category+" 리딩 · "+spread+"장 선택</small>";
 createDeck();
};

$("todayStart").onclick=()=>{
 readingMode="today";spread=1;category="오늘";
 resetReading();openReading();
 try{
  const saved=JSON.parse(localStorage.getItem(TODAY_KEY)||"null");
  const cdata=saved&&saved.day===localDateKey()&&saved.item?.cards?.[0];
  const card=cdata&&tarot.find(c=>c.name===cdata.name);
  if(card){
   selected=[{c:card,rev:!!cdata.reverse}];
   $("qview").innerHTML="🌙 <b>오늘의 카드</b><br><small>오늘 이미 뽑은 카드를 다시 보여드릴게요.</small>";
   document.querySelector("#reading h1").textContent="오늘의 카드";
   document.querySelector(".hint").textContent="";
   $("deckStage").style.display="none";
   $("cards").style.display="flex";
   $("cards").innerHTML=`<div class="wrap"><div class="card flipped">${cardFaces(selected[0])}</div></div>`;
   showResults(true);return;
  }
 }catch(e){}
 $("qview").innerHTML="🌙 <b>오늘의 카드</b><br><small>오늘 나에게 필요한 메시지를 골라보세요.</small>";
 document.querySelector("#reading h1").textContent="오늘의 카드를 선택하세요";
 document.querySelector(".hint").textContent="질문은 필요 없어요. 마음이 가는 카드 한 장을 골라주세요 ✦";
 createDeck();
};

function cardFaces(o){
 return `<div class="face back">✦</div><div class="face front"><div class="num">${o.c.num}</div><div class="emoji-art" style="${o.rev?"transform:rotate(180deg)":""}">${o.c.sym}</div><div class="name">${o.c.name}</div><div class="dir">${o.rev?"역방향 ↓":"정방향 ↑"}</div></div>`;
}

function createDeck(){
 const deck=$("deck"),note=$("pickNote");deck.innerHTML="";
 for(let i=0;i<18;i++){const d=document.createElement("button");d.type="button";d.className="pick-card shuffling";d.innerHTML="✦";d.style.zIndex=i+1;deck.appendChild(d)}
 note.textContent="카드를 섞는 중이에요…";
 setTimeout(()=>{const cs=[...deck.children];cs.forEach((d,i)=>{const off=i-(cs.length-1)/2;d.classList.remove("shuffling");d.style.transform=`translate(${off*15}px, ${Math.abs(off)*1.15}px) rotate(${off*2.2}deg)`;d.onclick=()=>pickFromDeck(d)});note.textContent=readingMode==="today"?"오늘 마음이 가는 카드 한 장을 골라주세요 ✦":`마음이 가는 카드 ${spread}장을 골라주세요 ✦`},1250);
}
function pickFromDeck(el){
 if(el.classList.contains("chosen")||selected.length>=spread)return;
 const pool=tarot.filter(c=>!selected.some(o=>o.c===c)),c=pool[Math.floor(Math.random()*pool.length)];
 selected.push({c,rev:Math.random()<.35});el.classList.add("chosen");el.style.transform+=" translateY(-28px)";
 $("pickNote").textContent=`${selected.length} / ${spread}장 선택했어요`;
 if(selected.length===spread){document.querySelectorAll(".pick-card").forEach(x=>x.classList.add("disabled"));setTimeout(revealPickedCards,650)}
}
function revealPickedCards(){
 $("deckStage").style.display="none";const cards=$("cards");cards.style.display="flex";cards.innerHTML="";let opened=0;
 selected.forEach(o=>{const d=document.createElement("div");d.className="wrap";d.innerHTML=`<div class="card">${cardFaces(o)}</div>`;const card=d.firstChild;card.onclick=()=>{if(card.classList.contains("flipped"))return;card.classList.add("flipped");if(++opened===selected.length)setTimeout(showResults,700)};cards.appendChild(d)});
 document.querySelector(".hint").textContent="선택한 카드를 눌러 한 장씩 확인하세요 ✦";
}

function adviceText(){
 const closing="카드는 미래를 확정하는 답이라기보다 현재 상황을 다른 관점에서 바라보도록 돕는 상징이에요.";
 if(readingMode==="today"){
  return `오늘의 키워드는 ‘${mainKeyword(selected[0])}’이에요. 하루를 보내며 이 키워드를 한 번씩 떠올려보세요. ${closing}`;
 }
 const n=selected.length,revCount=selected.filter(o=>o.rev).length;
 const flow=n===3
  ?`과거 ‘${mainKeyword(selected[0])}’ → 현재 ‘${mainKeyword(selected[1])}’ → 미래 ‘${mainKeyword(selected[2])}’의 흐름이 보여요.`
  :`이번 리딩의 핵심 키워드는 ‘${mainKeyword(selected[0])}’이에요.`;
 const tone=revCount===0?"카드가 정방향으로 나와 흐름이 비교적 순조로운 편이에요."
  :revCount*2>n?"역방향 카드가 많아 지금은 막힌 부분을 점검하고 속도를 조절할 때예요."
  :"순조로운 부분과 조심할 부분이 함께 보이니, 역방향 카드의 메시지를 특히 눈여겨보세요.";
 return `${flow} ${tone} ${closing}`;
}

function showResults(restored=false){
 if(restored!==true) saveCurrentReading();
 const r=$("results"),pos=readingMode==="today"?["오늘의 카드"]:spread===3?["과거","현재","미래"]:["현재의 메시지"];
 r.style.display="block";
 r.innerHTML="<h2>🌙 카드의 메시지</h2>"+selected.map((o,i)=>{
  const x=readingOf(o);
  return `<div class="result"><div class="result-emoji"><span style="display:inline-block;${o.rev?"transform:rotate(180deg)":""}">${o.c.sym}</span></div><div class="pos">${pos[i]}</div><div class="title">${o.c.name} ${o.rev?"↓":"↑"}</div><div class="keyword">${x.kw}</div><div class="text">${x.text}</div>${x.catText?`<div class="cat-text"><b>${category} 관점</b> · ${x.catText}</div>`:""}</div>`;
 }).join("")+`<div class="result advice"><div class="title">${readingMode==="today"?"🌙 오늘의 메시지":"✨ 이번 리딩의 조언"}</div><div class="text">${adviceText()}</div></div><button class="secondary" id="againBtn">${readingMode==="today"?"홈으로 돌아가기":"다시 타로 보기"}</button>`;
 $("againBtn").onclick=showHome;
 r.scrollIntoView({behavior:"smooth"});
}

function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]")}catch(e){return[]}}
function saveCurrentReading(){
 if(!selected.length)return;
 const item={
  date:new Date().toLocaleString("ko-KR"),
  mode:readingMode,category,
  question:readingMode==="today"?"오늘의 카드":$("question").value.trim(),
  cards:selected.map(o=>{const x=readingOf(o);return {number:o.c.num,name:o.c.name,symbol:o.c.sym,reverse:o.rev,keyword:x.kw,text:x.text,catText:x.catText}})
 };
 try{
  const h=getHistory();h.unshift(item);localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,100)));
  if(readingMode==="today") localStorage.setItem(TODAY_KEY,JSON.stringify({day:localDateKey(),item}));
 }catch(e){}
}
function renderHistory(){
 const list=$("historyList"),h=getHistory();
 if(!h.length){list.innerHTML='<div class="panel history-empty">아직 저장된 타로가 없어요.<br>카드를 뽑으면 여기에 자동으로 기록됩니다. 🌙</div>';return}
 list.innerHTML=h.map(historyEntryHtml).join("");
}
function historyEntryHtml(x){
 return `<div class="history-entry"><div class="history-date">${escapeHtml(x.date)} · ${x.mode==="today"?"오늘의 카드":escapeHtml(x.category)}</div><div class="history-question">${escapeHtml(x.question||"")}</div><div>${x.cards.map((c,i)=>`<div class="history-card-detail"><div class="history-card-visual"><div class="history-emoji-card"><span class="history-emoji-symbol" style="${c.reverse?"transform:rotate(180deg)":""}">${escapeHtml(tarot.find(t=>t.name===c.name)?.sym||c.symbol||"🔮")}</span></div><b>${escapeHtml(c.name)}</b><br>${c.reverse?"역방향 ↓":"정방향 ↑"}</div><div class="history-card-copy">${x.cards.length===3?`<div class="history-card-pos">${["과거","현재","미래"][i]}</div>`:""}<div class="history-card-name">${escapeHtml(c.name)} ${c.reverse?"↓":"↑"}</div><div class="history-card-keyword">${escapeHtml(c.keyword||"")}</div><div class="history-card-text">${escapeHtml(c.text||"")}</div>${c.catText?`<div class="history-card-text">${escapeHtml(x.category)} 관점 · ${escapeHtml(c.catText)}</div>`:""}</div></div>`).join("")}</div></div>`;
}

function setNav(active){
 $("navHome").classList.toggle("active",active==="home");
 $("navHistory").classList.toggle("active",active==="history");
 window.scrollTo(0,0);
}
function showHome(){
 $("home").style.display="block";$("reading").style.display="none";$("history").style.display="none";$("historyDelete").style.display="none";
 $("nav").style.display="flex";
 resetReading();setNav("home");
}
function showHistory(){
 $("home").style.display="none";$("reading").style.display="none";$("history").style.display="block";$("historyDelete").style.display="none";
 $("nav").style.display="flex";
 renderHistory();setNav("history");
}
function showDeleteSelect(){
 const h=getHistory();
 if(!h.length){alert("저장된 타로 기록이 없습니다. 🌙");return}
 $("history").style.display="none";$("historyDelete").style.display="block";$("nav").style.display="none";
 $("deleteList").innerHTML=h.map((x,i)=>`<label class="del-entry"><input type="radio" data-i="${i}" aria-label="기록 선택">${historyEntryHtml(x)}</label>`).join("");
 updateDeleteBtn();window.scrollTo(0,0);
}
function updateDeleteBtn(){
 const n=document.querySelectorAll("#deleteList input:checked").length;
 $("deleteConfirm").disabled=!n;
 $("deleteConfirm").textContent=n?`삭제 (${n})`:"삭제";
}
// 라디오 버튼은 기본적으로 한 번 켜면 끌 수 없어서, 다시 누르면 해제되도록 직접 처리
$("deleteList").addEventListener("click",e=>{
 const inp=e.target.closest("input");
 if(!inp)return;
 if(inp.dataset.was==="1"){inp.checked=false;inp.dataset.was="0"}else inp.dataset.was="1";
 updateDeleteBtn();
});
$("navHome").onclick=showHome;
$("navHistory").onclick=showHistory;
$("clearHistory").onclick=showDeleteSelect;
$("deleteCancel").onclick=showHistory;
$("deleteConfirm").onclick=()=>{
 const picked=new Set([...document.querySelectorAll("#deleteList input:checked")].map(i=>+i.dataset.i));
 if(!picked.size)return;
 const h=getHistory(),removed=h.filter((_,i)=>picked.has(i));
 try{
  localStorage.setItem(HISTORY_KEY,JSON.stringify(h.filter((_,i)=>!picked.has(i))));
  const t=JSON.parse(localStorage.getItem(TODAY_KEY)||"null");
  if(t&&removed.some(r=>r.mode==="today"&&r.date===t.item?.date))localStorage.removeItem(TODAY_KEY);
 }catch(e){}
 showHistory();
};

let installPrompt=null;
const isStandalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
$("installBtn").hidden=isStandalone;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e});
window.addEventListener("appinstalled",()=>{installPrompt=null;$("installBtn").hidden=true});
$("installBtn").onclick=async()=>{
 if(installPrompt){
  installPrompt.prompt();
  const {outcome}=await installPrompt.userChoice;
  installPrompt=null;
  if(outcome==="accepted")$("installBtn").hidden=true;
  return;
 }
 $("installSteps").innerHTML=isIOS
  ?"<li><b>Safari</b>로 이 페이지를 열어주세요.</li><li>하단의 <b>공유 버튼</b>(□↑)을 누르세요.</li><li><b>‘홈 화면에 추가’</b>를 선택하세요.</li>"
  :"<li>브라우저 메뉴(<b>⋮</b>)를 여세요.</li><li><b>‘앱 설치’</b> 또는 <b>‘홈 화면에 추가’</b>를 선택하세요.</li><li>이미 설치했다면 홈 화면의 <b>달빛 타로</b> 아이콘으로 열어주세요.</li>";
 $("installGuide").hidden=false;
};
$("installClose").onclick=()=>$("installGuide").hidden=true;
$("installGuide").onclick=e=>{if(e.target===$("installGuide"))$("installGuide").hidden=true};

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
}
</script>
